name: Build and verify desktop packages
on:
  push:
    branches: [main, experiment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/build-release.py --platform ${{ matrix.platform }}
      - shell: pwsh
        run: |
          $package = (Get-ChildItem dist/*.zip).FullName
          python scripts/verify-package.py "$package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: misrah-${{ matrix.platform }}
          path: dist/*
